# GENERATED by create-context-hygiene. Do not hand-edit; re-run the generator.
#
# The authority. The pre-commit hook is bypassable with --no-verify, so it can
# only ever be the early warning; this is the check that holds the line.
#
# No path filter on the triggers, deliberately: a budget covers a TOTAL, so a
# change anywhere in the always-on set — a new skill, a new @-import, a bigger
# memory index — can break it without touching CLAUDE.md.
#
# The counter is pinned to the one the target chose. If it is `anthropic`, this
# job needs an ANTHROPIC_API_KEY secret and will fail loudly without one, rather
# than quietly falling back to a different counter — a commit that passes
# locally and fails here with no explanation is worse than a missing-key error.
name: context-hygiene

on:
  push:
  pull_request:

jobs:
  budgets:
    name: Token budgets and placement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install counter dependencies
        run: |
          python -m pip install --upgrade pip
          echo "heuristic counter: no dependencies beyond the standard library"

      - name: Check token budgets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .context-hygiene/check_budget.py --counter heuristic --all-sections

      # `if: always()` so a budget failure does not hide the placement findings —
      # the two answer different questions and you want both in one run.
      - name: Check placement (context-lint)
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f .context-hygiene/context_lint.py ]; then
            python .context-hygiene/context_lint.py --counter heuristic
          else
            echo "context-lint is not installed in this repo — skipping."
          fi
